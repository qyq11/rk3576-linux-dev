<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1220" viewBox="0 0 1600 1220">
  <title>SN100 三页集成：1600×900 历史页移植版标注</title>
  <desc>引用同目录原始 PNG；原图像素、配色和布局未改。编号和箭头说明已有导航、状态及必要滚动。本图不是原 Windows 视觉一致性验收。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d84030"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#222}.title{font-size:25px;font-weight:700}.sub{font-size:17px}.note{font-size:20px}.arrow{fill:none;stroke:#d84030;stroke-width:3;marker-end:url(#arrow)}.badge{fill:#fff;stroke:#d84030;stroke-width:3}.number{font-family:sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#c33427}</style>
  </defs>
  <rect width="1600" height="1220" fill="white"/>
  <text x="24" y="30" class="title">三页集成界面 · 1600 × 900 · 历史页</text>
  <text x="24" y="57" class="sub">仅说明当前移植版操作与滚动；非原 Windows 视觉验收。PNG 原图完整保留。</text>
  <image x="0" y="70" width="1600" height="900" href="20261023_sn100_integrated_1600_history_01.png" xlink:href="20261023_sn100_integrated_1600_history_01.png"/>
  <g><circle class="badge" cx="1060" cy="175" r="17"/><text class="number" x="1060" y="175">1</text><path class="arrow" d="M1073 162 L1102 136"/></g>
  <g><circle class="badge" cx="382" cy="118" r="17"/><text class="number" x="382" y="118">2</text><path class="arrow" d="M364 118 L319 127"/></g>
  <g><circle class="badge" cx="1320" cy="420" r="17"/><text class="number" x="1320" y="420">3</text><path class="arrow" d="M1333 407 L1447 371"/><path class="arrow" d="M1333 433 L1447 689"/></g>
  <g><circle class="badge" cx="800" cy="916" r="17"/><text class="number" x="800" y="916">4</text><path class="arrow" d="M800 935 L800 961"/></g>
  <g><circle class="badge" cx="1540" cy="830" r="17"/><text class="number" x="1540" y="830">5</text><path class="arrow" d="M1557 830 L1591 830"/></g>
  <g class="note">
    <text x="25" y="1012">① 顶部现有会话与注销：当前为匿名工程师模拟会话。</text>
    <text x="25" y="1052">② 原有顶部状态区：当前离线；此截图不证明仪器状态已验证。</text>
    <text x="25" y="1092">③ 历史操作：详情、查询、CSV 导出；灰色操作仍不可用。</text>
    <text x="25" y="1132">④ 底部横向滚动：向左返回主导航；保留原界面布局。</text>
    <text x="25" y="1172">⑤ 右侧纵向滚动：查看下方原有内容与状态信息。</text>
  </g>
</svg>