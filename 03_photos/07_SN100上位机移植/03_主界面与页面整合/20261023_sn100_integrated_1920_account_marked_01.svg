<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1440" viewBox="0 0 1920 1440">
  <title>SN100 三页集成：1920×1080 账户页移植版标注</title>
  <desc>引用同目录原始 PNG；原图像素、配色和布局未改。编号和箭头说明主导航、账户与医院子页、现有状态区及必要滚动。本图不是原 Windows 视觉一致性验收。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d84030"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#222}.title{font-size:25px;font-weight:700}.sub{font-size:17px}.note{font-size:20px}.arrow{fill:none;stroke:#d84030;stroke-width:3;marker-end:url(#arrow)}.badge{fill:#fff;stroke:#d84030;stroke-width:3}.number{font-family:sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#c33427}</style>
  </defs>
  <rect width="1920" height="1440" fill="white"/>
  <text x="24" y="30" class="title">三页集成界面 · 1920 × 1080 · 账户页</text>
  <text x="24" y="57" class="sub">仅说明当前移植版操作与滚动；非原 Windows 视觉验收。PNG 原图完整保留。</text>
  <image x="0" y="70" width="1920" height="1080" href="20261023_sn100_integrated_1920_account_01.png" xlink:href="20261023_sn100_integrated_1920_account_01.png"/>
  <g><circle class="badge" cx="1200" cy="119" r="17"/><text class="number" x="1200" y="119">1</text><path class="arrow" d="M1217 119 L1300 131"/></g>
  <g><circle class="badge" cx="1770" cy="218" r="17"/><text class="number" x="1770" y="218">2</text><path class="arrow" d="M1778 234 L1797 281"/></g>
  <g><circle class="badge" cx="190" cy="708" r="17"/><text class="number" x="190" y="708">3</text><path class="arrow" d="M172 708 L101 708"/></g>
  <g><circle class="badge" cx="704" cy="483" r="17"/><text class="number" x="704" y="483">4</text><path class="arrow" d="M722 483 L849 483"/></g>
  <g><circle class="badge" cx="1775" cy="1095" r="17"/><text class="number" x="1775" y="1095">5</text><path class="arrow" d="M1790 1106 L1893 1142"/></g>
  <g><circle class="badge" cx="755" cy="119" r="17"/><text class="number" x="755" y="119">6</text><path class="arrow" d="M737 119 L640 128"/></g>
  <g class="note">
    <text x="25" y="1192">① 当前匿名会话与注销共用主壳；正式密码登录尚未接入。</text>
    <text x="25" y="1232">② 用户设置子页：账户设置、医院信息设置；其余入口仍按当前接入范围显示。</text>
    <text x="25" y="1272">③ 左侧统一主导航：“用户设置”进入本页，“结果报告”进入历史查询。</text>
    <text x="25" y="1312">④ 原账户表单与角色选项沿用已移植规则；截图中的输入框无密码内容。</text>
    <text x="25" y="1352">⑤ 边缘滚动条保留完整布局；控件可达性另有 1600 / 1920 实际点击证据。</text>
    <text x="25" y="1392">⑥ 原有顶部设备状态区：当前为脱机界面，不代表板端或仪器验收通过。</text>
  </g>
</svg>